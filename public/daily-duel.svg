<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Duelio daily dilemma</title>
  <desc id="desc">Two bold blue and coral speech cards face off around a central versus mark.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fd"/>
      <stop offset="1" stop-color="#e8ebf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#14162b" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#paper)"/>
  <circle cx="1060" cy="110" r="220" fill="#2433e0" opacity=".08"/>
  <circle cx="145" cy="640" r="270" fill="#c81e4b" opacity=".08"/>
  <path d="M44 44h1112v632H44z" fill="none" stroke="#14162b" stroke-opacity=".14" stroke-width="3"/>
  <g filter="url(#shadow)" transform="rotate(-8 360 352)">
    <rect x="116" y="164" width="430" height="386" rx="10" fill="#2433e0"/>
    <path d="M210 550h106l-74 80z" fill="#2433e0"/>
    <circle cx="202" cy="238" r="30" fill="#fff"/>
    <text x="202" y="249" fill="#2433e0" font-family="Arial,sans-serif" font-size="32" font-weight="800" text-anchor="middle">A</text>
    <rect x="178" y="318" width="282" height="16" rx="8" fill="#fff" opacity=".96"/>
    <rect x="178" y="359" width="236" height="16" rx="8" fill="#fff" opacity=".72"/>
    <rect x="178" y="400" width="264" height="16" rx="8" fill="#fff" opacity=".72"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(8 840 352)">
    <rect x="654" y="164" width="430" height="386" rx="10" fill="#c81e4b"/>
    <path d="M886 550h106l-32 80z" fill="#c81e4b"/>
    <circle cx="740" cy="238" r="30" fill="#fff"/>
    <text x="740" y="249" fill="#c81e4b" font-family="Arial,sans-serif" font-size="32" font-weight="800" text-anchor="middle">B</text>
    <rect x="716" y="318" width="282" height="16" rx="8" fill="#fff" opacity=".96"/>
    <rect x="716" y="359" width="236" height="16" rx="8" fill="#fff" opacity=".72"/>
    <rect x="716" y="400" width="264" height="16" rx="8" fill="#fff" opacity=".72"/>
  </g>
  <circle cx="600" cy="356" r="83" fill="#14162b" stroke="#f8f9fd" stroke-width="10"/>
  <text x="600" y="374" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="900" text-anchor="middle">VS</text>
  <text x="600" y="644" fill="#14162b" font-family="Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="7" text-anchor="middle">THE DAILY DUEL</text>
